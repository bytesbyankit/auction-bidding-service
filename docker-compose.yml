services:
  rethinkdb:
    image: rethinkdb:latest
    container_name: auction-rethinkdb
    command: ["rethinkdb", "--bind", "all", "--cache-size", "1024"]
    # In production, database ports are bound to 127.0.0.1 to prevent external exposure
    ports:
      - "127.0.0.1:28015:28015"
      - "127.0.0.1:8080:8080"
    volumes:
      - rethinkdb_data:/data
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/28015'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - auction-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auction-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      RETHINKDB_HOST: rethinkdb
      RETHINKDB_PORT: 28015
      RETHINKDB_DB: ${RETHINKDB_DB:-auction_db}
      RETHINKDB_USER: ${RETHINKDB_USER:-admin}
      RETHINKDB_PASSWORD: ${RETHINKDB_PASSWORD:-}
      ALLOW_SELF_OUTBID: ${ALLOW_SELF_OUTBID:-true}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-1000}
      BID_RATE_LIMIT_MAX_REQUESTS: ${BID_RATE_LIMIT_MAX_REQUESTS:-120}
      DB_POOL_MIN_BUFFER: ${DB_POOL_MIN_BUFFER:-10}
      DB_POOL_MAX_CONNECTIONS: ${DB_POOL_MAX_CONNECTIONS:-100}
    depends_on:
      rethinkdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - auction-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M

networks:
  auction-network:
    driver: bridge

volumes:
  rethinkdb_data:
    driver: local
